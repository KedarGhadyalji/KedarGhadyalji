<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="GitHub stats">
<defs>
  <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#EBBCBA" stop-opacity=".45"/><stop offset="1" stop-color="#EBBCBA" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C4A7E7"/><stop offset="1" stop-color="#EBBCBA"/>
  </linearGradient>
</defs>
<style>
  .title{font:700 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#EBBCBA}
  .lbl{font:500 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#908CAA}
  .val{font:700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#E0DEF4}
  .big{font:800 32px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#E0DEF4}
  .mid{font:700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#EBBCBA}
  .sub{font:400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#908CAA}
  .ax{font:400 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#908CAA}
  .pt{font:600 10px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#E0DEF4}
  .in{animation:fade .8s ease both}
  @keyframes fade{from{opacity:0}}
</style>
<rect x=".5" y=".5" width="494" height="194" rx="12" fill="#191724" stroke="#403D52"/>
<text x="25" y="35" class="title">Kedar Kiran Ghadyalji's GitHub Stats</text><g class="in" style="animation-delay:0.0s"><rect x="25" y="57" width="8" height="8" rx="2" fill="#C4A7E7"/><text x="44" y="66" class="lbl">Total Stars</text><text x="250" y="66" class="val" text-anchor="end">0</text></g><g class="in" style="animation-delay:0.1s"><rect x="25" y="79" width="8" height="8" rx="2" fill="#C4A7E7"/><text x="44" y="88" class="lbl">Commits (past year)</text><text x="250" y="88" class="val" text-anchor="end">867</text></g><g class="in" style="animation-delay:0.2s"><rect x="25" y="101" width="8" height="8" rx="2" fill="#C4A7E7"/><text x="44" y="110" class="lbl">Pull Requests</text><text x="250" y="110" class="val" text-anchor="end">0</text></g><g class="in" style="animation-delay:0.3s"><rect x="25" y="123" width="8" height="8" rx="2" fill="#C4A7E7"/><text x="44" y="132" class="lbl">Issues</text><text x="250" y="132" class="val" text-anchor="end">1</text></g><g class="in" style="animation-delay:0.4s"><rect x="25" y="145" width="8" height="8" rx="2" fill="#C4A7E7"/><text x="44" y="154" class="lbl">Contributed To</text><text x="250" y="154" class="val" text-anchor="end">1</text></g><g class="in" style="animation-delay:0.5s"><rect x="25" y="167" width="8" height="8" rx="2" fill="#C4A7E7"/><text x="44" y="176" class="lbl">Public Repos</text><text x="250" y="176" class="val" text-anchor="end">10</text></g><circle cx="392" cy="92" r="38" fill="none" stroke="#2A273F" stroke-width="8"/><circle cx="392" cy="92" r="38" fill="none" stroke="url(#bar)" stroke-width="8" stroke-linecap="round" stroke-dasharray="220.1 238.8" transform="rotate(-90 392 92)"/><text x="392" y="99" class="val" text-anchor="middle" style="font-size:20px">922</text><text x="392" y="150" class="sub" text-anchor="middle">contributions</text><text x="392" y="165" class="sub" text-anchor="middle">in the past year</text>
</svg>