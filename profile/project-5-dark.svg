<rect x=".5" y=".5" width="494" height="255" rx="12" fill="#191724" stroke="#403D52"/>
<g class="in" style="animation-delay:0.32s"><rect x="24" y="19" width="12" height="15" rx="2.5" fill="none" stroke="#EBBCBA" stroke-width="1.6"/><rect x="27" y="23" width="6" height="1.6" rx=".8" fill="#EBBCBA"/><text x="46" y="32" class="title" style="font-size:16px">MindCare AI</text><rect x="323" y="17" width="148" height="22" rx="11" fill="none" stroke="#C4A7E7" stroke-width="1"/><text x="397" y="32" class="sub" text-anchor="middle" style="fill:#C4A7E7">AI wellness platform</text><text x="24" y="66" class="lbl" style="fill:#E0DEF4;font-weight:400">Predicts student stress with an XGBoost model and SHAP</text><text x="24" y="84" class="lbl" style="fill:#E0DEF4;font-weight:400">explanations, plus Dr. Eva, a crisis-aware wellness</text><text x="24" y="102" class="lbl" style="fill:#E0DEF4;font-weight:400">chatbot.</text><polygon points="30,129 35,134 30,139 25,134" fill="#EBBCBA"/><text x="44" y="138" class="lbl" style="fill:#EBBCBA;font-weight:600">400+ tests, admin panel and crisis alert workflow</text><rect x="24" y="156" width="66" height="23" rx="11.5" fill="#26233A" stroke="#524F67"/><text x="57" y="172" class="sub" text-anchor="middle" style="fill:#E0DEF4">FastAPI</text><rect x="98" y="156" width="53" height="23" rx="11.5" fill="#26233A" stroke="#524F67"/><text x="124" y="172" class="sub" text-anchor="middle" style="fill:#E0DEF4">React</text><rect x="159" y="156" width="86" height="23" rx="11.5" fill="#26233A" stroke="#524F67"/><text x="202" y="172" class="sub" text-anchor="middle" style="fill:#E0DEF4">TypeScript</text><rect x="253" y="156" width="66" height="23" rx="11.5" fill="#26233A" stroke="#524F67"/><text x="286" y="172" class="sub" text-anchor="middle" style="fill:#E0DEF4">XGBoost</text><rect x="327" y="156" width="59" height="23" rx="11.5" fill="#26233A" stroke="#524F67"/><text x="356" y="172" class="sub" text-anchor="middle" style="fill:#E0DEF4">SQLite</text><rect x="24" y="186" width="86" height="23" rx="11.5" fill="#26233A" stroke="#524F67"/><text x="67" y="202" class="sub" text-anchor="middle" style="fill:#E0DEF4">Gemini API</text><text x="471" y="239" class="sub" text-anchor="end" style="fill:#908CAA">View repository →</text></g>
