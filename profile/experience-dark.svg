<svg xmlns="http://www.w3.org/2000/svg" width="990" height="921" viewBox="0 0 990 921" role="img" aria-label="Experience timeline">
<defs>
  <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#EBBCBA" stop-opacity=".45"/><stop offset="1" stop-color="#EBBCBA" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C4A7E7"/><stop offset="1" stop-color="#EBBCBA"/>
  </linearGradient>
</defs>
<style>
  .title{font:700 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#EBBCBA}
  .lbl{font:500 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#908CAA}
  .val{font:700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#E0DEF4}
  .big{font:800 32px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#E0DEF4}
  .mid{font:700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#EBBCBA}
  .sub{font:400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#908CAA}
  .ax{font:400 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#908CAA}
  .pt{font:600 10px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#E0DEF4}
  .in{animation:fade .8s ease both}
  @keyframes fade{from{opacity:0}}
</style>
<rect x=".5" y=".5" width="989" height="920" rx="12" fill="#191724" stroke="#403D52"/>
<text x="28" y="36" class="title">Experience</text><rect x="45" y="91" width="2" height="600" rx="1" fill="#403D52"/><circle cx="46" cy="91" r="7" fill="#191724" stroke="#C4A7E7" stroke-width="2.5"/><circle cx="46" cy="190" r="7" fill="#C4A7E7" stroke="#191724" stroke-width="3"/><circle cx="46" cy="357" r="7" fill="#C4A7E7" stroke="#191724" stroke-width="3"/><circle cx="46" cy="524" r="7" fill="#C4A7E7" stroke="#191724" stroke-width="3"/><circle cx="46" cy="691" r="7" fill="#EBBCBA" stroke="#191724" stroke-width="3"/><g class="in" style="animation-delay:0.00s"><text x="72" y="78" class="sub" style="fill:#908CAA">Now</text><text x="72" y="100" class="val" style="font-size:16px">Open to internships and full-time roles</text><text x="72" y="124" class="lbl" style="fill:#E0DEF4;font-weight:400">Software engineering roles, open-source collaboration, and applied AI and full-stack projects.</text></g><g class="in" style="animation-delay:0.15s"><text x="72" y="177" class="sub" style="fill:#908CAA">Oct 2, 2026</text><text x="72" y="199" class="val" style="font-size:16px">Published ZeroBucket on npm</text><text x="72" y="219" class="mid" style="fill:#C4A7E7">Open source</text><text x="72" y="241" class="lbl" style="fill:#E0DEF4;font-weight:400">Released the TypeScript package of ZeroBucket, bringing database-native image storage to JavaScript and</text><text x="72" y="260" class="lbl" style="fill:#E0DEF4;font-weight:400">TypeScript projects.</text><rect x="72" y="287" width="86" height="23" rx="11.5" fill="#26233A" stroke="#524F67"/><text x="115" y="303" class="sub" text-anchor="middle" style="fill:#E0DEF4">TypeScript</text><rect x="166" y="287" width="86" height="23" rx="11.5" fill="#26233A" stroke="#524F67"/><text x="209" y="303" class="sub" text-anchor="middle" style="fill:#E0DEF4">PostgreSQL</text></g><g class="in" style="animation-delay:0.30s"><text x="72" y="344" class="sub" style="fill:#908CAA">Aug 24, 2026</text><text x="72" y="366" class="val" style="font-size:16px">Published ZeroBucket on PyPI</text><text x="72" y="386" class="mid" style="fill:#C4A7E7">Open source</text><text x="72" y="408" class="lbl" style="fill:#E0DEF4;font-weight:400">Released ZeroBucket as a Python library that keeps images in the Postgres, SQLite or MySQL database you</text><text x="72" y="427" class="lbl" style="fill:#E0DEF4;font-weight:400">already run, with a Django adapter.</text><rect x="72" y="454" width="59" height="23" rx="11.5" fill="#26233A" stroke="#524F67"/><text x="102" y="470" class="sub" text-anchor="middle" style="fill:#E0DEF4">Python</text><rect x="139" y="454" width="59" height="23" rx="11.5" fill="#26233A" stroke="#524F67"/><text x="168" y="470" class="sub" text-anchor="middle" style="fill:#E0DEF4">Django</text><rect x="206" y="454" width="86" height="23" rx="11.5" fill="#26233A" stroke="#524F67"/><text x="249" y="470" class="sub" text-anchor="middle" style="fill:#E0DEF4">PostgreSQL</text></g><g class="in" style="animation-delay:0.45s"><text x="72" y="511" class="sub" style="fill:#908CAA">Jul 5, 2026</text><text x="72" y="533" class="val" style="font-size:16px">Published Tailwind Warning Auto-Fix on the VS Code Marketplace</text><text x="72" y="553" class="mid" style="fill:#C4A7E7">VS Code extension</text><text x="72" y="575" class="lbl" style="fill:#E0DEF4;font-weight:400">Fixes every Tailwind CSS IntelliSense warning in a file with one command, and one undo reverts the whole</text><text x="72" y="594" class="lbl" style="fill:#E0DEF4;font-weight:400">batch.</text><rect x="72" y="621" width="86" height="23" rx="11.5" fill="#26233A" stroke="#524F67"/><text x="115" y="637" class="sub" text-anchor="middle" style="fill:#E0DEF4">TypeScript</text><rect x="166" y="621" width="92" height="23" rx="11.5" fill="#26233A" stroke="#524F67"/><text x="212" y="637" class="sub" text-anchor="middle" style="fill:#E0DEF4">VS Code API</text><rect x="266" y="621" width="99" height="23" rx="11.5" fill="#26233A" stroke="#524F67"/><text x="316" y="637" class="sub" text-anchor="middle" style="fill:#E0DEF4">Tailwind CSS</text></g><g class="in" style="animation-delay:0.60s"><text x="72" y="678" class="sub" style="fill:#908CAA">Jan 2026 - Apr 2026</text><text x="72" y="700" class="val" style="font-size:16px">Research and Innovation Intern, Software Development</text><text x="72" y="720" class="mid" style="fill:#C4A7E7">Cyber Secured India</text><text x="72" y="742" class="lbl" style="fill:#E0DEF4;font-weight:400">Engineered core system mechanics, interactive modules, and progress-tracking layouts for a centralized</text><text x="72" y="761" class="lbl" style="fill:#E0DEF4;font-weight:400">Learning Management System (LMS).</text><polygon points="75,775 80,779 75,783 70,779" fill="#EBBCBA"/><text x="90" y="783" class="lbl" style="fill:#E0DEF4;font-weight:400">Implemented secure dual-mode authentication, dynamic evaluation tools, discussion forums, and</text><text x="90" y="802" class="lbl" style="fill:#E0DEF4;font-weight:400">automated certificate generation</text><polygon points="75,816 80,820 75,824 70,820" fill="#EBBCBA"/><text x="90" y="824" class="lbl" style="fill:#E0DEF4;font-weight:400">Optimized front-facing delivery channels, improving mobile responsiveness, layout performance, and</text><text x="90" y="843" class="lbl" style="fill:#E0DEF4;font-weight:400">UI stability</text><rect x="72" y="870" width="53" height="23" rx="11.5" fill="#26233A" stroke="#524F67"/><text x="98" y="886" class="sub" text-anchor="middle" style="fill:#E0DEF4">React</text><rect x="133" y="870" width="86" height="23" rx="11.5" fill="#26233A" stroke="#524F67"/><text x="176" y="886" class="sub" text-anchor="middle" style="fill:#E0DEF4">TypeScript</text><rect x="227" y="870" width="66" height="23" rx="11.5" fill="#26233A" stroke="#524F67"/><text x="260" y="886" class="sub" text-anchor="middle" style="fill:#E0DEF4">MongoDB</text></g>
</svg>