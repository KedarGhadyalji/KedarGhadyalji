<rect x=".5" y=".5" width="494" height="255" rx="12" fill="#FFFAF3" stroke="#E4D8CE"/>
<g class="in" style="animation-delay:0.32s"><rect x="24" y="19" width="12" height="15" rx="2.5" fill="none" stroke="#B4637A" stroke-width="1.6"/><rect x="27" y="23" width="6" height="1.6" rx=".8" fill="#B4637A"/><text x="46" y="32" class="title" style="font-size:16px">MindCare AI</text><rect x="323" y="17" width="148" height="22" rx="11" fill="none" stroke="#907AA9" stroke-width="1"/><text x="397" y="32" class="sub" text-anchor="middle" style="fill:#907AA9">AI wellness platform</text><text x="24" y="66" class="lbl" style="fill:#575279;font-weight:400">Predicts student stress with an XGBoost model and SHAP</text><text x="24" y="84" class="lbl" style="fill:#575279;font-weight:400">explanations, plus Dr. Eva, a crisis-aware wellness</text><text x="24" y="102" class="lbl" style="fill:#575279;font-weight:400">chatbot.</text><polygon points="30,129 35,134 30,139 25,134" fill="#B4637A"/><text x="44" y="138" class="lbl" style="fill:#B4637A;font-weight:600">400+ tests, admin panel and crisis alert workflow</text><rect x="24" y="156" width="66" height="23" rx="11.5" fill="#F2E9E1" stroke="#D9CBBF"/><text x="57" y="172" class="sub" text-anchor="middle" style="fill:#575279">FastAPI</text><rect x="98" y="156" width="53" height="23" rx="11.5" fill="#F2E9E1" stroke="#D9CBBF"/><text x="124" y="172" class="sub" text-anchor="middle" style="fill:#575279">React</text><rect x="159" y="156" width="86" height="23" rx="11.5" fill="#F2E9E1" stroke="#D9CBBF"/><text x="202" y="172" class="sub" text-anchor="middle" style="fill:#575279">TypeScript</text><rect x="253" y="156" width="66" height="23" rx="11.5" fill="#F2E9E1" stroke="#D9CBBF"/><text x="286" y="172" class="sub" text-anchor="middle" style="fill:#575279">XGBoost</text><rect x="327" y="156" width="59" height="23" rx="11.5" fill="#F2E9E1" stroke="#D9CBBF"/><text x="356" y="172" class="sub" text-anchor="middle" style="fill:#575279">SQLite</text><rect x="24" y="186" width="86" height="23" rx="11.5" fill="#F2E9E1" stroke="#D9CBBF"/><text x="67" y="202" class="sub" text-anchor="middle" style="fill:#575279">Gemini API</text><rect x="338" y="231" width="10" height="8" rx="2" fill="none" stroke="#797593" stroke-width="1.4"/><path d="M340 231v-2.5a3 3 0 0 1 6 0V231" fill="none" stroke="#797593" stroke-width="1.4"/><text x="471" y="239" class="sub" text-anchor="end" style="fill:#797593">Private repository</text></g>
