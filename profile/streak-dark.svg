</style>
<rect x=".5" y=".5" width="989" height="149" rx="12" fill="#191724" stroke="#403D52"/>
<g class="in" style="animation-delay:0.00s"><text x="165" y="62" class="big" text-anchor="middle">929</text><text x="165" y="92" class="mid" text-anchor="middle">Total Contributions</text><text x="165" y="114" class="sub" text-anchor="middle">Sep 17, 2024 - Present</text></g><g class="in" style="animation-delay:0.15s"><text x="495" y="62" class="big" text-anchor="middle">280</text><text x="495" y="92" class="mid" text-anchor="middle">Current Streak</text><text x="495" y="114" class="sub" text-anchor="middle">Jan 1 - Oct 7</text></g><g class="in" style="animation-delay:0.30s"><text x="825" y="62" class="big" text-anchor="middle">280</text><text x="825" y="92" class="mid" text-anchor="middle">Longest Streak</text><text x="825" y="114" class="sub" text-anchor="middle">Jan 1 - Oct 7</text></g><rect x="330" y="30" width="1.5" height="90" rx=".75" fill="#403D52"/><rect x="660" y="30" width="1.5" height="90" rx=".75" fill="#403D52"/><rect x="445" y="124" width="100" height="4" rx="2" fill="#2A273F"/><rect x="445" y="124" width="100" height="4" rx="2" fill="url(#bar)"/>
</svg>