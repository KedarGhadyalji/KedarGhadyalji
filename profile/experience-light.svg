<svg xmlns="http://www.w3.org/2000/svg" width="990" height="612" viewBox="0 0 990 612" role="img" aria-label="Experience timeline">
<defs>
  <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#B4637A" stop-opacity=".45"/><stop offset="1" stop-color="#B4637A" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#907AA9"/><stop offset="1" stop-color="#B4637A"/>
  </linearGradient>
</defs>
<style>
  .title{font:700 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#B4637A}
  .lbl{font:500 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#797593}
  .val{font:700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#575279}
  .big{font:800 32px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#575279}
  .mid{font:700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#B4637A}
  .sub{font:400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#797593}
  .ax{font:400 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#797593}
  .pt{font:600 10px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#575279}
  .in{animation:fade .8s ease both}
  @keyframes fade{from{opacity:0}}
</style>
<rect x=".5" y=".5" width="989" height="611" rx="12" fill="#FFFAF3" stroke="#E4D8CE"/>
<text x="28" y="36" class="title">Experience</text><rect x="45" y="91" width="2" height="291" rx="1" fill="#E4D8CE"/><circle cx="46" cy="91" r="7" fill="#FFFAF3" stroke="#907AA9" stroke-width="2.5"/><circle cx="46" cy="190" r="7" fill="#907AA9" stroke="#FFFAF3" stroke-width="3"/><circle cx="46" cy="382" r="7" fill="#B4637A" stroke="#FFFAF3" stroke-width="3"/><g class="in" style="animation-delay:0.00s"><text x="72" y="78" class="sub" style="fill:#797593">Now</text><text x="72" y="100" class="val" style="font-size:16px">Open to internships and full-time roles</text><text x="72" y="124" class="lbl" style="fill:#575279;font-weight:400">Software engineering roles, open-source collaboration, and applied AI and full-stack projects.</text></g><g class="in" style="animation-delay:0.15s"><text x="72" y="177" class="sub" style="fill:#797593">Aug 2026 - Present</text><text x="72" y="199" class="val" style="font-size:16px">Creator and maintainer, ZeroBucket</text><text x="72" y="219" class="mid" style="fill:#907AA9">Open source</text><text x="72" y="241" class="lbl" style="fill:#575279;font-weight:400">An open-source library for database-native image storage, published on PyPI and npm.</text><polygon points="75,255 80,259 75,263 70,259" fill="#B4637A"/><text x="90" y="263" class="lbl" style="fill:#575279;font-weight:400">Keeps images in the Postgres, SQLite or MySQL database you already run, with a Django adapter</text><polygon points="75,277 80,281 75,285 70,281" fill="#B4637A"/><text x="90" y="285" class="lbl" style="fill:#575279;font-weight:400">Released as a Python package and as a TypeScript package</text><rect x="72" y="312" width="59" height="23" rx="11.5" fill="#F2E9E1" stroke="#D9CBBF"/><text x="102" y="328" class="sub" text-anchor="middle" style="fill:#575279">Python</text><rect x="139" y="312" width="86" height="23" rx="11.5" fill="#F2E9E1" stroke="#D9CBBF"/><text x="182" y="328" class="sub" text-anchor="middle" style="fill:#575279">TypeScript</text><rect x="233" y="312" width="86" height="23" rx="11.5" fill="#F2E9E1" stroke="#D9CBBF"/><text x="276" y="328" class="sub" text-anchor="middle" style="fill:#575279">PostgreSQL</text></g><g class="in" style="animation-delay:0.30s"><text x="72" y="369" class="sub" style="fill:#797593">Jan 2026 - Apr 2026</text><text x="72" y="391" class="val" style="font-size:16px">Research and Innovation Intern, Software Development</text><text x="72" y="411" class="mid" style="fill:#907AA9">Cyber Secured India</text><text x="72" y="433" class="lbl" style="fill:#575279;font-weight:400">Engineered core system mechanics, interactive modules, and progress-tracking layouts for a centralized</text><text x="72" y="452" class="lbl" style="fill:#575279;font-weight:400">Learning Management System (LMS).</text><polygon points="75,466 80,470 75,474 70,470" fill="#B4637A"/><text x="90" y="474" class="lbl" style="fill:#575279;font-weight:400">Implemented secure dual-mode authentication, dynamic evaluation tools, discussion forums, and</text><text x="90" y="493" class="lbl" style="fill:#575279;font-weight:400">automated certificate generation</text><polygon points="75,507 80,511 75,515 70,511" fill="#B4637A"/><text x="90" y="515" class="lbl" style="fill:#575279;font-weight:400">Optimized front-facing delivery channels, improving mobile responsiveness, layout performance, and</text><text x="90" y="534" class="lbl" style="fill:#575279;font-weight:400">UI stability</text><rect x="72" y="561" width="53" height="23" rx="11.5" fill="#F2E9E1" stroke="#D9CBBF"/><text x="98" y="577" class="sub" text-anchor="middle" style="fill:#575279">React</text><rect x="133" y="561" width="86" height="23" rx="11.5" fill="#F2E9E1" stroke="#D9CBBF"/><text x="176" y="577" class="sub" text-anchor="middle" style="fill:#575279">TypeScript</text><rect x="227" y="561" width="66" height="23" rx="11.5" fill="#F2E9E1" stroke="#D9CBBF"/><text x="260" y="577" class="sub" text-anchor="middle" style="fill:#575279">MongoDB</text></g>
</svg>