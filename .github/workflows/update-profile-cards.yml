name: Update Profile Cards

on:
  schedule:
    - cron: "0 3 * * *"          # daily
  workflow_dispatch: {}           # manual run from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build tech stack and button SVGs
        run: |
          npm install --no-save --no-audit --no-fund simple-icons@16.34.0 simple-icons-legacy@npm:simple-icons@11.15.0
          node scripts/build_static_assets.js

      - name: Generate stats, languages, streak and activity cards
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional: add a PAT (scope: read:user) as TROPHY_TOKEN to include private contributions.
          GH_TOKEN: ${{ secrets.TROPHY_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_cards.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update profile cards"
          git pull --rebase origin main
          git push
