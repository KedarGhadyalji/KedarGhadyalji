name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"          # daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake (Emerald Night palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=A7F3D0&color_dots=161B22,064E3B,047857,10B981,34D399
            dist/github-contribution-grid-snake.svg?color_snake=064E3B&color_dots=EBEDF0,A7F3D0,6EE7B7,34D399,059669

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
