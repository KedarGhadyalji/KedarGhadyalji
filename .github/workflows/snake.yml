name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"          # daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake (Rose Dusk palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#9CCFD8&color_dots=#26233A,#403D52,#6E6A86,#C4A7E7,#EBBCBA
            dist/github-contribution-grid-snake.svg?color_snake=#B4637A&color_dots=#EBEDF0,#E0DEF4,#C4A7E7,#907AA9,#56526E

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
